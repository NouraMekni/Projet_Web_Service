<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <h1>🌆 Smart City</h1>
            <h2>Welcome Back</h2>
            <p>Login to access your dashboard</p>
        </div>

        <!-- Remove (ngSubmit) to avoid double submission -->
        <div class="login-form">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" [(ngModel)]="email" name="email" placeholder="Enter your email" required
                    [disabled]="isLoading" />
            </div>

            <div class="input-group">
                <label>Password</label>
                <div class="password-input">
                    <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" name="password"
                        placeholder="Enter your password" required [disabled]="isLoading" />
                    <button type="button" class="toggle-password" (click)="togglePasswordVisibility()">
                        {{ showPassword ? '🙈' : '👁️' }}
                    </button>
                </div>
            </div>

            <button class="login-btn" (click)="login()" [disabled]="isLoading">
                {{ isLoading ? 'Logging in...' : 'Login' }}
            </button>

            <div class="register-link">
                Don't have an account? <a routerLink="/register">Register here</a>
            </div>
        </div>
    </div>
</div>
