<div class="dashboard-container">
    <div class="header">
        <h1>🛠️ Operator Dashboard</h1>
        <p>Control and monitor smart city modules</p>
    </div>

    <div class="dashboard-cards">
        <!-- Vehicle Management Card -->
        <div class="card" (click)="goToVehicles()">
            <div class="icon">🚗</div>
            <h2>Vehicle Management</h2>
            <p>Track vehicles, monitor movement in real-time</p>
            <button>Open Module →</button>
        </div>

        <!-- Incident Management Card - NOW ACTIVE -->
        <div class="card" (click)="goToIncidents()">
            <div class="icon">🚨</div>
            <h2>Incident Management</h2>
            <p>Report and handle city incidents efficiently</p>
            <button>Open Module →</button>
        </div>
    </div>
</div>
